app_name: "admin-service-go-consumer"
project_name: "platform-engineering"

git_repositories:
  - url: "https://bitbucket.org/fastbanking/ring-go-admin-service"
    git_account_name: "Bitbucket"
    checkout_path: "./"
    fetch_submodules: false

build_configurations:
  container_registry_name: "onemi-prod-ecr"
  repository_name: "go-admin-service-kafka-consumer"
  build_type: "DockerfileExists"
  dockerfile_path: "scripts/docker/kafka_consumer.Dockerfile"

base_configurations:
  deployment_template:
    version: "5.2.0"
    chart_type: "Rollout Deployment"
    show_application_metrics: false
    values_path: "base-admin-service-go-consumer-values.yaml"
  secrets:
    - name: "aws-asm-admin-service-go-consumer"
      type: "environment"
      external: true
      externalType: "ESO_AWSSecretsManager"
      esoSecretData:
        secretStore:
          aws:
            service: "SecretsManager"
            region: "ap-south-1"
            role: "arn:aws:iam::183716846541:role/onemi-app-prod-admin-service-irsa-role"
        refreshInterval: "2m"
        esoDataFrom:
          - extract:
              key: "onemi/prod/admin-service-go/app-credentials"

workflows:
  - ci_pipeline:
      type: "CI_BUILD"
      is_manual: false
      name: "ci-prod-pe"
      branches:
        - repo: "ring-go-admin-service"
          branch: "main"
          type: "SOURCE_TYPE_BRANCH_FIXED"
    cd_pipelines:
      - name: "cd-prod-pe"
        environment_name: "prod-pe"
        is_manual: false
        deployment_type: "argo_cd"
        deployment_strategies:
          - name: "ROLLING"
            strategy:
              maxSurge: "25%"
              maxUnavailable: 1
            default: true
        env_configuration:
          deployment_template:
            type: "override"
            version: "5.2.0"
            merge_strategy: "replace"
            show_application_metrics: false
            values_path: "override-admin-service-go-consumer-prod-pe-values.yaml"
          secrets:
            - name: "aws-asm-admin-service-go-consumer"
              type: "environment"
              external: true
              mergeStrategy: "replace"
              externalType: "ESO_AWSSecretsManager"
              esoSecretData:
                secretStore:
                  aws:
                    service: "SecretsManager"
                    region: "ap-south-1"
                    auth:
                      jwt:
                        serviceAccountRef:
                          name: "admin-gateway-go-sa"
                refreshInterval: "2m"
                esoDataFrom:
                  - extract:
                      key: "onemi/prod/admin-gateway-go/app-credentials"